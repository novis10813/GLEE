name: build Blackwell wheel

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish artifacts to the selected release tag
        required: true
        type: boolean
        default: false
      release_tag:
        description: GitHub release tag
        required: true
        type: string
        default: agentic-v0.1.0

permissions:
  contents: write

jobs:
  wheel:
    runs-on: [self-hosted, linux, x64, blackwell]
    env:
      CUDA_HOME: /usr/local/cuda-12.8
      TORCH_CUDA_ARCH_LIST: "12.0"
      MAX_JOBS: "16"
      DETECTRON2_WHEEL_URL: https://github.com/novis10813/detectron2/releases/download/agentic-v0.6.0/detectron2-0.6+torch2.7.1cu128.sm120-cp312-cp312-linux_x86_64.whl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install build environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python \
            torch==2.7.1+cu128 torchvision==0.22.1+cu128 \
            --index-url https://download.pytorch.org/whl/cu128
          uv pip install --python .venv/bin/python "$DETECTRON2_WHEEL_URL"
          uv pip install --python .venv/bin/python \
            build einops fairscale ninja timm transformers setuptools wheel
      - name: Build wheel
        env:
          PYTHON: .venv/bin/python
        run: bash scripts/build_blackwell_wheel.sh
      - name: Install and smoke test
        run: |
          uv pip install --python .venv/bin/python dist/instructnav_glee_backend-*.whl
          .venv/bin/python scripts/smoke_test_blackwell.py
      - uses: actions/upload-artifact@v4
        with:
          name: instructnav-glee-blackwell-wheel
          path: |
            dist/*.whl
            dist/SHA256SUMS
            dist/build-metadata.json
      - name: Publish tagged release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist/*.whl
            dist/SHA256SUMS
            dist/build-metadata.json
